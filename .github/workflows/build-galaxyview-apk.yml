name: Build Galaxy View APK

on:
  push:
    branches: [main]
    paths:
      - 'galaxyview-apk-src/**'
      - '.github/workflows/build-galaxyview-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tooling
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK
        working-directory: galaxyview-apk-src
        run: gradle --no-daemon :galaxyview:assembleDebug
      - name: Publish s.apk to public repo
        run: |
          cp galaxyview-apk-src/galaxyview/build/outputs/apk/debug/galaxyview-debug.apk s.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add s.apk
          git commit -m 'Publish Galaxy View POS test APK' || exit 0
          git push
